<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema Sol-Tierra-Luna</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060d;
    --panel: #0b1224;
    --edge: #3a5a8c;
    --ink: #bfe6ff;
    --dim: #6f8fb5;
    --sun: #ffcf4a;
    --font: "VT323", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--font); color: var(--ink); font-size: 20px; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* scanlines + vignette: the "old web monitor" feel */
  .crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }

  .win {
    position: fixed; z-index: 10; background: var(--panel);
    border: 2px solid var(--edge); box-shadow: 4px 4px 0 rgba(0,0,0,.6);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .win .bar {
    background: linear-gradient(90deg, #1d3a6b, #0e1d3a);
    border-bottom: 2px solid var(--edge);
    padding: 2px 10px; color: #e8f4ff; letter-spacing: .05em;
    display: flex; justify-content: space-between; gap: 16px;
  }
  .win .body { padding: 8px 12px; line-height: 1.15; }
  .info { top: 12px; left: 12px; width: min(320px, calc(100vw - 24px)); }
  .info .row { display: flex; justify-content: space-between; gap: 12px; }
  .info .row span:first-child { color: var(--dim); }
  .info .sun { color: var(--sun); }
  .hint {
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px;
    padding: 4px 12px; color: var(--dim); font-size: 18px;
  }
  .hint b { color: var(--ink); font-weight: normal; }
  .ctl { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: 12px; padding: 4px 10px; display: flex; gap: 10px; align-items: center; }
  .ctl input { accent-color: var(--sun); width: 110px; }
  @media (max-width: 560px) { .hint { display: none; } .ctl { left: 12px; right: 12px; justify-content: space-between; } .ctl input { flex: 1; } }
  @media (prefers-reduced-motion: reduce) { .crt { opacity: .6; } }
</style>
</head>
<body>
<div class="crt"></div>

<div class="win info">
  <div class="bar"><span>sol-3.exe</span><span>_ □ x</span></div>
  <div class="body">
    <div class="row"><span>Estrella</span><span class="sun">Sol, tipo G</span></div>
    <div class="row"><span>Planeta</span><span>Tierra (procedural)</span></div>
    <div class="row"><span>Satélite</span><span>Luna</span></div>
    <div class="row"><span>Día simulado</span><span id="day">0</span></div>
    <div class="row"><span>Fase lunar</span><span id="phase">0%</span></div>
  </div>
</div>
<div class="win hint"><b>Arrastra</b> para girar · <b>rueda / pellizco</b> para acercar</div>
<div class="win ctl"><span>Velocidad</span><input id="speed" type="range" min="0" max="5" step="0.1" value="1"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Procedural noise ---------- */
  function hash(x, y, z) {
    var s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise3(x, y, z) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var xf = smooth(x - xi), yf = smooth(y - yi), zf = smooth(z - zi);
    function l(a, b, t) { return a + (b - a) * t; }
    return l(
      l(l(hash(xi, yi, zi), hash(xi + 1, yi, zi), xf), l(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), xf), yf),
      l(l(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), xf), l(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), xf), yf),
      zf);
  }
  function fbm(x, y, z, oct) {
    var v = 0, a = 0.5, f = 1;
    for (var i = 0; i < oct; i++) { v += a * noise3(x * f, y * f, z * f); f *= 2; a *= 0.5; }
    return v;
  }

  /* Equirectangular canvas texture; sampled on the sphere so there is no seam */
  function makeTexture(w, h, fn) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var ctx = c.getContext("2d"), img = ctx.createImageData(w, h), d = img.data;
    for (var py = 0; py < h; py++) {
      var lat = (py / h - 0.5) * Math.PI;
      for (var px = 0; px < w; px++) {
        var lon = (px / w) * Math.PI * 2;
        var x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
        var col = fn(x, y, z), i = (py * w + px) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col.length > 3 ? col[3] : 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  /* ---------- Textures ---------- */
  var sunTex = makeTexture(512, 256, function (x, y, z) {
    var n = fbm(x * 3 + 7, y * 3, z * 3, 5);
    var g = fbm(x * 9, y * 9 + 3, z * 9, 3);
    var c = mix([255, 150, 20], [255, 235, 110], Math.min(1, n * 1.3));
    return mix(c, [255, 255, 200], Math.max(0, g - 0.6) * 1.5);
  });

  var earthTex = makeTexture(512, 256, function (x, y, z) {
    var h = fbm(x * 2 + 11, y * 2, z * 2, 5);
    var pole = Math.abs(y) + (fbm(x * 6, y * 6, z * 6, 3) - 0.5) * 0.25;
    if (pole > 0.86) return [240, 246, 252];
    if (h < 0.5) return mix([8, 28, 90], [30, 95, 170], Math.min(1, h / 0.5));        // sea
    if (h < 0.53) return [218, 200, 140];                                                // shore
    var t = (h - 0.53) / 0.3;
    if (t > 0.85) return [235, 235, 235];                                                // peaks
    return mix([40, 130, 55], [125, 100, 60], Math.min(1, t * 1.2));                     // land
  });

  var cloudTex = makeTexture(512, 256, function (x, y, z) {
    var n = fbm(x * 3 + 40, y * 4, z * 3, 5);
    var a = Math.max(0, Math.min(1, (n - 0.5) * 4));
    return [255, 255, 255, Math.round(a * 210)];
  });

  var moonTex = makeTexture(256, 128, function (x, y, z) {
    var n = fbm(x * 4 + 5, y * 4, z * 4, 5);
    var crater = Math.pow(noise3(x * 9, y * 9, z * 9), 6) * 1.6;   // sparse darker pits
    var v = 215 + (n - 0.5) * 70 - crater * 60;
    v = Math.max(120, Math.min(255, v));
    return [v, v, v];
  });

  function glowTexture(inner, outer) {
    var c = document.createElement("canvas"); c.width = c.height = 256;
    var g = c.getContext("2d"), grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grd.addColorStop(0, inner); grd.addColorStop(0.35, outer); grd.addColorStop(1, "rgba(255,160,0,0)");
    g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }

  /* ---------- Scene ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04060d);
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);

  // Stars
  (function () {
    var n = 1500, pos = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = 200 + Math.random() * 100, s = Math.sqrt(1 - u * u);
      pos[i * 3] = r * s * Math.cos(th); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(th);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xcfe4ff, size: 1.2, sizeAttenuation: false })));
  })();

  // Sun
  var sun = new THREE.Mesh(new THREE.SphereGeometry(3.5, 48, 32), new THREE.MeshBasicMaterial({ map: sunTex }));
  scene.add(sun);
  var glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture("rgba(255,240,170,0.9)", "rgba(255,190,40,0.35)"),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
  }));
  glow.scale.set(20, 20, 1);
  scene.add(glow);
  scene.add(new THREE.PointLight(0xfff2cc, 1.6, 0, 0));
  scene.add(new THREE.AmbientLight(0x1a2438, 0.9));

  // Earth system: pivot -> earth (tilted) -> moon pivot
  var EARTH_DIST = 15, MOON_DIST = 2.6;
  var earthOrbit = new THREE.Object3D(); scene.add(earthOrbit);
  var earthHolder = new THREE.Object3D(); earthHolder.position.x = EARTH_DIST; earthOrbit.add(earthHolder);
  var earthTilt = new THREE.Object3D(); earthTilt.rotation.z = 23.4 * Math.PI / 180; earthHolder.add(earthTilt);
  var earth = new THREE.Mesh(new THREE.SphereGeometry(1.3, 48, 32), new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.9, metalness: 0 }));
  earthTilt.add(earth);
  var clouds = new THREE.Mesh(new THREE.SphereGeometry(1.34, 48, 32), new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, depthWrite: false, roughness: 1 }));
  earthTilt.add(clouds);
  var atmo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture("rgba(120,180,255,0.0)", "rgba(90,160,255,0.35)"),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
  }));
  atmo.scale.set(4.2, 4.2, 1); earthHolder.add(atmo);

  var moonPivot = new THREE.Object3D(); moonPivot.rotation.x = 5 * Math.PI / 180; earthHolder.add(moonPivot);
  var moon = new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1 }));
  moon.position.x = MOON_DIST; moonPivot.add(moon);

  // Orbit guides
  function ring(r, color, opacity, parent) {
    var pts = [];
    for (var i = 0; i <= 128; i++) { var a = i / 128 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); }
    var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity }));
    parent.add(l);
  }
  ring(EARTH_DIST, 0x3a5a8c, 0.45, scene);
  var moonRingHolder = new THREE.Object3D(); earthHolder.add(moonRingHolder);
  ring(MOON_DIST, 0x8aa0c0, 0.3, moonRingHolder);
  moonRingHolder.rotation.x = 5 * Math.PI / 180;

  /* ---------- Camera: drag to orbit, wheel/pinch to zoom ---------- */
  var yaw = 0.6, pitch = 0.45, dist = 34, targetDist = 34;
  var pointers = {}, lastPinch = 0;
  var el = renderer.domElement;
  el.addEventListener("pointerdown", function (e) { el.setPointerCapture(e.pointerId); pointers[e.pointerId] = { x: e.clientX, y: e.clientY }; });
  el.addEventListener("pointerup", function (e) { delete pointers[e.pointerId]; lastPinch = 0; });
  el.addEventListener("pointercancel", function (e) { delete pointers[e.pointerId]; lastPinch = 0; });
  el.addEventListener("pointermove", function (e) {
    var p = pointers[e.pointerId]; if (!p) return;
    var ids = Object.keys(pointers);
    if (ids.length === 1) {
      yaw -= (e.clientX - p.x) * 0.006;
      pitch = Math.max(-1.35, Math.min(1.35, pitch + (e.clientY - p.y) * 0.006));
    }
    p.x = e.clientX; p.y = e.clientY;
    if (ids.length === 2) {
      var a = pointers[ids[0]], b = pointers[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastPinch) targetDist = clamp(targetDist * (lastPinch / d), 6, 90);
      lastPinch = d;
    }
  });
  el.addEventListener("wheel", function (e) { e.preventDefault(); targetDist = clamp(targetDist * (1 + e.deltaY * 0.001), 6, 90); }, { passive: false });
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  /* ---------- Loop ---------- */
  var speedEl = document.getElementById("speed"), dayEl = document.getElementById("day"), phaseEl = document.getElementById("phase");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var simDay = 0, last = performance.now(), idle = 0;
  var tmpE = new THREE.Vector3(), tmpM = new THREE.Vector3();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var speed = parseFloat(speedEl.value) * (reduced ? 0.3 : 1);
    simDay += dt * speed * 20;                               // 20 simulated days per second at x1

    earthOrbit.rotation.y = -simDay / 365.25 * Math.PI * 2;
    earth.rotation.y = simDay * Math.PI * 2;                  // 1 turn per day (fast, readable at low speed)
    earth.rotation.y = simDay * 0.35;
    clouds.rotation.y = simDay * 0.4;
    moonPivot.rotation.y = -simDay / 27.3 * Math.PI * 2;
    moon.rotation.y = -moonPivot.rotation.y;                  // keep the same face toward Earth
    sun.rotation.y = simDay * 0.01;

    earthHolder.getWorldPosition(tmpE); moon.getWorldPosition(tmpM);
    var toSun = tmpE.clone().negate().normalize(), toMoon = tmpM.sub(tmpE).normalize();
    var illum = (1 - toSun.dot(toMoon)) / 2;                  // 0 new moon, 1 full moon
    dayEl.textContent = Math.floor(simDay);
    phaseEl.textContent = Math.round(illum * 100) + "%";

    if (!Object.keys(pointers).length && !reduced) yaw += dt * 0.04;   // slow drift while idle
    dist += (targetDist - dist) * 0.1;
    camera.position.set(
      Math.sin(yaw) * Math.cos(pitch) * dist,
      Math.sin(pitch) * dist,
      Math.cos(yaw) * Math.cos(pitch) * dist
    );
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
