<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sun, Earth and Moon</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="crt"></div>

<div class="win info">
  <div class="bar"><span>sun-3.exe</span><span>_ □ x</span></div>
  <div class="body">
    <div class="row"><span>Star</span><span class="sun">Sun, G-type</span></div>
    <div class="row"><span>Planet</span><span>Earth (procedural)</span></div>
    <div class="row"><span>Satellite</span><span>Moon</span></div>
    <div class="row"><span>Simulated day</span><span id="day">0</span></div>
    <div class="row"><span>Moon phase</span><span id="phase">0%</span></div>
  </div>
</div>
<div class="win hint"><b>Drag</b> to rotate · <b>wheel / pinch</b> to zoom</div>
<div class="win ctl"><span>Speed</span><input id="speed" type="range" min="0" max="5" step="0.1" value="1"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
